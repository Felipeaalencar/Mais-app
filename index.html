function fixJSON(s){
  s=s.replace(/```json|```/gi,'').trim();
  try{return JSON.parse(s)}catch(e){}
  const lc=Math.max(s.lastIndexOf(',"'),s.lastIndexOf(',\n'));
  if(lc>s.length*0.5)s=s.substring(0,lc);
  const st=[];let inS=false,es=false;
  for(let i=0;i<s.length;i++){const c=s[i];if(es){es=false;continue}if(c==='\\'&&inS){es=true;continue}if(c==='"'){inS=!inS;continue}if(!inS){if(c==='{'||c==='[')st.push(c==='{'?'}':']');if(c==='}'||c===']')st.pop()}}
  while(st.length)s+=st.pop();
  try{return JSON.parse(s)}catch(e){return null}
}

function Result({data,onPDF}){

      {tab==='resumo'&&<div><Sec title="Resumo" icon="📋" accent="#38bdf8"><p style={{lineHeight:'1.7',color:'#94a3b8',fontSize:'12px'}}>{data.resumo}</p></Sec><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}><Sec title="Paciente" icon="👤" accent="#818cf8"><div style={{fontSize:'11px',lineHeight:1.8}}>{data.paciente?.idade&&<div><span style={{color:'#64748b'}}>Idade: </span>{data.paciente.idade}</div>}{data.paciente?.setor&&<div><span style={{color:'#64748b'}}>Setor: </span>{data.paciente.setor}</div>}{data.paciente?.comorbidades?.length>0&&<div style={{marginTop:'6px'}}><div style={{fontSize:'9px',color:'#64748b',marginBottom:'3px'}}>COMORBIDADES</div>{data.paciente.comorbidades.map(c=><Tag key={c} color="#a78bfa">{c}</Tag>)}</div>}</div></Sec><Sec title="Queixa" icon="🩺" accent="#f472b6"><p style={{color:'#f9a8d4',fontWeight:600,marginBottom:'7px',lineHeight:'1.4',fontSize:'12px'}}>{data.paciente?.queixa}</p>{data.paciente?.sintomas?.map(s=><Tag key={s} color="#22d3ee">{s}</Tag>)}</Sec></div>{data.tendencias&&<Sec title="Tendencias" icon="📈" accent="#34d399"><p style={{color:'#94a3b8',lineHeight:'1.6',fontSize:'12px'}}>{data.tendencias}</p></Sec>}</div>}

function buildReport(data,paciente,createdAt){
  const now=createdAt?fmt(createdAt):new Date().toLocaleString('pt-BR');
  const sv=data.paciente?.sinais_vitais||{};const sbar=data.sbar||{};const L=[];
  L.push('MAIS — inteligencia clinica');L.push('================================');
  if(paciente){L.push('Paciente: '+(paciente.nome||''));if(paciente.leito)L.push('Leito: '+paciente.leito);if(paciente.setor)L.push('Setor: '+paciente.setor);}
  L.push('Data: '+now);L.push('');
  if(data.resumo){L.push('RESUMO');L.push(data.resumo);L.push('');}
  if(Object.keys(sv).length>0){L.push('SINAIS VITAIS');Object.entries(sv).forEach(([k,v])=>L.push(k+': '+v));L.push('');}
  const q=data.sepse?.qsofa;if(q){L.push('qSOFA: '+(q.pontos??0)+'/3 — '+(q.risco||''));L.push('');}
  if((data.hipoteses||[]).length>0){L.push('HIPOTESES');(data.hipoteses||[]).forEach((h,i)=>L.push((i+1)+'. '+h.nome+' ('+h.prob+')'));L.push('');}
  if((data.red_flags||[]).length>0){L.push('RED FLAGS');(data.red_flags||[]).forEach(f=>L.push('! '+f));L.push('');}
  if((data.passos||[]).length>0){L.push('PROXIMOS PASSOS');(data.passos||[]).forEach((p,i)=>L.push((i+1)+'. '+p));L.push('');}
  if(sbar.situacao||sbar.background){L.push('SBAR');if(sbar.situacao)L.push('S: '+sbar.situacao);if(sbar.background)L.push('B: '+sbar.background);if(sbar.avaliacao)L.push('A: '+sbar.avaliacao);if(sbar.recomendacao)L.push('R: '+sbar.recomendacao);L.push('');}
  if((data.checklist||[]).length>0){L.push('CHECKLIST');(data.checklist||[]).forEach(c=>L.push('☐ '+c));L.push('');}
  L.push('================================');L.push('Nao substitui julgamento medico.');
  return L.join('\n');
}

        <button onClick={()=>window.print()} style={{background:'#0ea5e9',border:'none',borderRadius:'6px',padding:'7px 18px',cursor:'pointer',color:'#fff',fontWeight:700}}>Salvar PDF</button>
      </div>

var RANGES={
  FC:{min:60,max:100,label:'FC',unit:'bpm',color:'#0ea5e9'},
  PAS:{min:90,max:140,label:'PAS',unit:'mmHg',color:'#8b5cf6'},
  PAD:{min:60,max:90,label:'PAD',unit:'mmHg',color:'#a78bfa'},
  FR:{min:12,max:20,label:'FR',unit:'irpm',color:'#f59e0b'},
  SpO2:{min:94,max:100,label:'SpO2',unit:'%',color:'#22c55e'},
  Glasgow:{min:15,max:15,label:'GCS',unit:'',color:'#38bdf8'},
  Temperatura:{min:36,max:37.5,label:'Temp',unit:'°C',color:'#fb923c'},
  Lactato:{min:0,max:2,label:'Lactato',unit:'mmol/L',color:'#ef4444'},
  PAM:{min:65,max:100,label:'PAM',unit:'mmHg',color:'#c084fc'},
};

function VitalChart({sv}){
  var items=Object.entries(RANGES).filter(function(e){
    var k=e[0];
    return Object.keys(sv).some(function(sk){return sk.toLowerCase().includes(k.toLowerCase())||k.toLowerCase().includes(sk.toLowerCase());});
  }).map(function(e){
    var key=e[0],range=e[1];
    var raw=Object.keys(sv).reduce(function(found,sk){
      if(sk.toLowerCase().includes(key.toLowerCase())||key.toLowerCase().includes(sk.toLowerCase()))return sv[sk];
      return found;
    },undefined);
    if(raw===undefined)return null;
    var val=parseFloat(String(raw).replace(/,/g,'.').match(/\d+\.?\d*/)?.[0]||'NaN');
    if(isNaN(val))return null;
    var low=range.min,high=range.max;
    var span=high-low;
    var pct=Math.min(Math.max((val-low)/span*100,0),150);
    var normal=val>=low&&val<=high;
    var color=normal?'#22c55e':val<low?'#f59e0b':'#ef4444';
    return{key,label:range.label,unit:range.unit,val,low,high,pct,color,normal,raw};
  }).filter(Boolean);
  if(items.length===0)return null;
  return(
    <div style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:'10px',padding:'14px',marginBottom:'12px'}}>
      <div style={{fontSize:'9px',color:'#64748b',letterSpacing:'0.1em',marginBottom:'14px'}}>PARAMETROS vs REFERENCIA NORMAL</div>
      {items.map(function(item){
        var barPct=Math.min(item.pct,100);
        var overPct=item.pct>100?Math.min((item.pct-100)*2,30):0;
        return(
          <div key={item.key} style={{marginBottom:'12px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'4px'}}>
              <span style={{fontSize:'10px',color:'#94a3b8',fontWeight:600}}>{item.label}</span>
              <div style={{display:'flex',alignItems:'baseline',gap:'6px'}}>
                <span style={{fontSize:'14px',fontWeight:700,color:item.color}}>{item.val}</span>
                <span style={{fontSize:'9px',color:'#475569'}}>{item.unit}</span>
                <span style={{fontSize:'9px',color:'#334155'}}>ref: {item.low}-{item.high}</span>
              </div>
            </div>
            <div style={{position:'relative',height:'8px',background:'#1e293b',borderRadius:'4px',overflow:'visible'}}>
              <div style={{position:'absolute',left:'0',top:'0',height:'100%',width:(item.low/(item.high*1.5)*100)+'%',background:'#1e293b',borderRadius:'4px 0 0 4px'}}/>
              <div style={{position:'absolute',left:(item.low/(item.high*1.5)*100)+'%',top:'-2px',height:'12px',width:((item.high-item.low)/(item.high*1.5)*100)+'%',background:'#22c55e20',border:'1px solid #22c55e40',borderRadius:'2px'}}/>
              <div style={{position:'absolute',left:'0',top:'0',height:'100%',width:Math.min(barPct/(item.high*1.5/item.high)*67,95)+'%',background:item.color,borderRadius:'4px',transition:'width 0.5s ease',minWidth:item.val>0?'3px':'0'}}/>
              {item.pct>100&&<div style={{position:'absolute',right:'0',top:'-1px',height:'10px',width:'6px',background:'#ef4444',borderRadius:'0 3px 3px 0'}}/>}
            </div>
          </div>
        );
      })}
      <div style={{display:'flex',gap:'14px',marginTop:'10px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'4px'}}><div style={{width:'10px',height:'4px',background:'#22c55e',borderRadius:'2px'}}/><span style={{fontSize:'9px',color:'#475569'}}>Normal</span></div>
        <div style={{display:'flex',alignItems:'center',gap:'4px'}}><div style={{width:'10px',height:'4px',background:'#f59e0b',borderRadius:'2px'}}/><span style={{fontSize:'9px',color:'#475569'}}>Abaixo</span></div>
        <div style={{display:'flex',alignItems:'center',gap:'4px'}}><div style={{width:'10px',height:'4px',background:'#ef4444',borderRadius:'2px'}}/><span style={{fontSize:'9px',color:'#475569'}}>Acima</span></div>
      </div>
    </div>
  );
}

var STATUS_CFG={
  estavel:{label:'Estavel',color:'#22c55e'},
  atencao:{label:'Atencao',color:'#f59e0b'},

function PinScreen({onUnlock}){
  var [pin,setPin]=React.useState('');
  var [err,setErr]=React.useState(false);
  function press(d){
    if(pin.length>=4)return;
    var next=pin+d;
    setPin(next);setErr(false);
    if(next.length===4){
      if(next==='1404'){onUnlock();}
      else{setTimeout(function(){setPin('');setErr(true);},400);}
    }
  }
  function del(){setPin(function(p){return p.slice(0,-1);});setErr(false);}
  return(
    <div style={{position:'fixed',inset:0,background:'#020617',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:9999}}>
      <svg width="56" height="56" viewBox="0 0 90 90" style={{marginBottom:'12px'}}><rect width="90" height="90" rx="20" fill="#0f172a"/><path d="M 6,45 L 12,45 L 15,25 L 25,56 L 35,25 L 45,45 L 50,45 L 54,38 L 57,18 L 62,72 L 66,38 L 70,45 L 82,45" fill="none" stroke="#1D9E75" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/><circle cx="57" cy="18" r="3.5" fill="#EF9F27"/></svg>
      <div style={{fontWeight:700,fontSize:'20px',color:'#1D9E75',letterSpacing:'6px',marginBottom:'4px'}}>MAIS</div>
      <div style={{fontSize:'10px',color:'#475569',letterSpacing:'0.2em',marginBottom:'40px'}}>inteligencia clinica.</div>
      <div style={{display:'flex',gap:'14px',marginBottom:'32px'}}>
        {[0,1,2,3].map(function(i){return(
          <div key={i} style={{width:'14px',height:'14px',borderRadius:'50%',background:pin.length>i?(err?'#ef4444':'#1D9E75'):'#1e293b',border:'2px solid '+(pin.length>i?(err?'#ef4444':'#1D9E75'):'#334155'),transition:'all 0.15s'}}/>
        );})}
      </div>
      {err&&<div style={{fontSize:'11px',color:'#ef4444',marginBottom:'16px'}}>Senha incorreta</div>}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'12px',width:'240px'}}>
        {[1,2,3,4,5,6,7,8,9,'',0,'x'].map(function(d,i){
          if(d==='')return <div key={i}/>;
          return(
            <button key={i} onClick={function(){d==='x'?del():press(String(d));}} style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:'12px',height:'64px',fontSize:'22px',fontWeight:600,color:'#f1f5f9',cursor:'pointer',fontFamily:'monospace'}}>
              {d==='x'?'<':d}
            </button>
          );
        })}
      </div>
    </div>
  );
}
function App(){
  const [patients,setPatients]=useState([]);

  const [npN,setNpN]=useState('');const [npL,setNpL]=useState('');const [npS,setNpS]=useState('');
  const [caseText,setCaseText]=useState('');
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [err,setErr]=useState(null);
  const [saved,setSaved]=useState('');
  const [showPDF,setShowPDF]=useState(false);
  const [unlocked,setUnlocked]=useState(false);
  const [dbLoad,setDbLoad]=useState(true);
  const [showDesfecho,setShowDesfecho]=useState(false);
  const [showStatusEdit,setShowStatusEdit]=useState(false);
  const [isRec,setIsRec]=useState(false);
  const [micErr,setMicErr]=useState("");
  const recRef=React.useRef(null);
  const [editPat,setEditPat]=useState(false);
  const [editN,setEditN]=useState('');
  const [editL,setEditL]=useState('');
  const [editS,setEditS]=useState('');

  useEffect(()=>{loadP()},[]);
  useEffect(()=>{if(sel)loadA(sel.id)},[sel]);

  async function loadP(){setDbLoad(true);const{data}=await db.from('pacientes').select('*').order('created_at',{ascending:false});setPatients(data||[]);setDbLoad(false)}
  async function loadA(pid){const{data}=await db.from('analises').select('*').eq('paciente_id',pid).order('created_at',{ascending:false});setAnalyses(prev=>({...prev,[pid]:data||[]}))}
  async function saveEditPat(){
    if(!editN.trim())return;
    const{data,error}=await db.from('pacientes').update({nome:editN.trim(),leito:editL.trim(),setor:editS.trim()}).eq('id',sel.id).select().single();
    if(!error){
      setSel(data);
      setPatients(prev=>prev.map(p=>p.id===sel.id?data:p));
      setEditPat(false);
    }
  }
  function toggleMic(){
    setMicErr("");
    if(isRec){if(recRef.current)recRef.current.stop();setIsRec(false);return;}
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setMicErr("Use o microfone do teclado iOS");return;}
    var r=new SR();r.lang="pt-BR";r.continuous=true;r.interimResults=true;
    r.onstart=function(){setIsRec(true);};
    r.onend=function(){setIsRec(false);};
    r.onerror=function(e){setIsRec(false);setMicErr("Erro: "+e.error);};
    r.onresult=function(e){var t="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)t+=e.results[i][0].transcript+" ";}if(t)setCaseText(function(prev){return (prev+t).trim()+" ";});};
    recRef.current=r;r.start();
  }
  async function createP(){if(!npN.trim())return;const{data,error}=await db.from('pacientes').insert({nome:npN.trim(),leito:npL.trim(),setor:npS.trim()}).select().single();if(!error){setPatients(prev=>[data,...prev]);setShowNP(false);setNpN('');setNpL('');setNpS('');setSel(data);setScreen('new');setResult(null);setCaseText('')}}

  async function analyze(){
    if(!caseText.trim())return;
    setLoading(true);setErr(null);setResult(null);setSaved('');
    try{
      const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({caseText,prompt:PROMPT})});
      if(!res.ok){const t=await res.text();throw new Error('API '+res.status+': '+t.slice(0,200))}
      const data=await res.json();
      if(data.error)throw new Error(data.error);
      const raw=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('')||'';
      if(!raw.trim())throw new Error('Resposta vazia.');
      const parsed=fixJSON(raw);
      if(!parsed)throw new Error('Erro ao interpretar resposta.');
      setResult(parsed);
      if(sel){const{data:aData,error}=await db.from('analises').insert({paciente_id:sel.id,caso_texto:caseText,resultado_json:parsed}).select().single();if(!error){setSaved('Salvo - '+fmt(aData.created_at));loadA(sel.id)}}
    }catch(e){setErr(e.message)}
    finally{setLoading(false)}
  }

  const patA=sel?analyses[sel.id]||[]:[];
  const filtered=patients.filter(p=>p.nome.toLowerCase().includes(search.toLowerCase())||(p.leito||'').toLowerCase().includes(search.toLowerCase()));

  if(showPDF&&(result||selA?.resultado_json))return <PrintView data={result||selA.resultado_json} paciente={sel} createdAt={selA?.created_at} onClose={()=>setShowPDF(false)}/>;

  return(
    <div style={{minHeight:'100vh',background:'#020617',fontFamily:'monospace',color:'#cbd5e1',fontSize:'13px'}}>

        <button onClick={()=>{setScreen('home');setSel(null);setResult(null);setCaseText('');setSelA(null)}} style={{background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:'10px',padding:0}}>
          <Logo size={32}/><div><div style={{fontWeight:700,fontSize:'16px',color:'#1D9E75',letterSpacing:'5px',lineHeight:1}}>MAIS</div><div style={{fontSize:'8px',color:'#475569',letterSpacing:'0.18em',marginTop:'2px'}}>inteligencia clinica.</div></div>
        </button>

        </div>

          </div>
          {showNP&&<div style={{margin:'0 8px 8px',background:'#0f172a',border:'1px solid #1D9E7540',borderRadius:'7px',padding:'10px'}}>
            <div style={{fontSize:'10px',color:'#1D9E75',marginBottom:'8px'}}>NOVO PACIENTE</div>

                {!editPat&&sel.desfecho&&<span style={{fontSize:'10px',fontWeight:700,padding:'3px 8px',borderRadius:'5px',color:sel.desfecho==='alta'?'#22c55e':sel.desfecho==='transferencia'?'#f59e0b':'#94a3b8',background:sel.desfecho==='alta'?'#022c22':sel.desfecho==='transferencia'?'#1c1000':'#1e293b'}}>{sel.desfecho==='alta'?'Alta':sel.desfecho==='transferencia'?'Transferido':'Obito'}</span>}
            {showStatusEdit&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={()=>setShowStatusEdit(false)}>
              <div style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:'12px',padding:'20px',width:'260px'}} onClick={function(e){e.stopPropagation();}}>
                <div style={{fontSize:'11px',color:'#64748b',marginBottom:'14px',letterSpacing:'0.1em'}}>STATUS CLINICO</div>
                {[{k:'estavel',l:'Estavel',c:'#22c55e'},{k:'atencao',l:'Atencao',c:'#f59e0b'},{k:'grave',l:'Grave',c:'#ef4444'},{k:'critico',l:'Critico',c:'#b91c1c'}].map(function(item){return(
                  <div key={item.k} onClick={async function(){
                    await db.from('pacientes').update({status_clinico:item.k}).eq('id',sel.id);
                    setSel(function(p){return Object.assign({},p,{status_clinico:item.k});});
                    setPatients(function(prev){return prev.map(function(p){return p.id===sel.id?Object.assign({},p,{status_clinico:item.k}):p;});});
                    setShowStatusEdit(false);
                  }} style={{display:'flex',alignItems:'center',gap:'12px',padding:'10px',borderRadius:'8px',cursor:'pointer',border:'1px solid '+item.c+'30',marginBottom:'6px',background:item.c+'10'}}>
                    <div style={{width:'10px',height:'10px',borderRadius:'50%',background:item.c,flexShrink:0}}/>
                    <span style={{color:item.c,fontWeight:700,fontSize:'14px'}}>{item.l}</span>
                  </div>
                );})}
                <button className="sbtn" style={{width:'100%',marginTop:'4px'}} onClick={()=>setShowStatusEdit(false)}>Cancelar</button>
              </div>
            </div>}

            {showDesfecho&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={()=>setShowDesfecho(false)}>
              <div style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:'12px',padding:'20px',width:'260px'}} onClick={e=>e.stopPropagation()}>
                <div style={{fontSize:'11px',color:'#64748b',marginBottom:'14px',letterSpacing:'0.1em'}}>REGISTRAR DESFECHO</div>
                {[{k:'alta',l:'Alta Medica',c:'#22c55e'},{k:'transferencia',l:'Transferencia',c:'#f59e0b'},{k:'obito',l:'Obito',c:'#94a3b8'}].map(function(item){return(
                  <div key={item.k} onClick={async function(){
                    var now=new Date().toISOString();
                    await db.from('pacientes').update({desfecho:item.k,desfecho_data:now}).eq('id',sel.id);
                    setSel(function(p){return Object.assign({},p,{desfecho:item.k,desfecho_data:now});});
                    setPatients(function(prev){return prev.map(function(p){return p.id===sel.id?Object.assign({},p,{desfecho:item.k}):p;});});
                    setShowDesfecho(false);
                  }} style={{display:'flex',alignItems:'center',gap:'12px',padding:'12px',borderRadius:'8px',cursor:'pointer',border:'1px solid '+item.c+'30',marginBottom:'8px',background:item.c+'10'}}>
                    <div style={{width:'10px',height:'10px',borderRadius:'50%',background:item.c,flexShrink:0}}/>
                    <span style={{color:item.c,fontWeight:700,fontSize:'14px'}}>{item.l}</span>
                  </div>
                );})}
                <button className="sbtn" style={{width:'100%',marginTop:'4px'}} onClick={()=>setShowDesfecho(false)}>Cancelar</button>
              </div>
            </div>}
              </div>
            </div>
            {patA.length===0&&<div style={{background:'#0f172a',border:'1px dashed #1e293b',borderRadius:'8px',padding:'32px',textAlign:'center'}}><div style={{fontSize:'12px',color:'#334155',marginBottom:'12px'}}>Nenhuma analise ainda.</div><button className="btn" onClick={()=>{setResult(null);setCaseText('');setSaved('');setScreen('new')}}>+ Criar primeira analise</button></div>}
            {patA.map(a=>(<div key={a.id} onClick={()=>{setSelA(a);setResult(a.resultado_json);setScreen('detail')}} style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:'7px',padding:'12px 14px',marginBottom:'8px',cursor:'pointer'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'7px'}}><span style={{fontSize:'11px',color:'#38bdf8',fontWeight:600}}>{fmt(a.created_at)}</span>{a.resultado_json?.urgente&&<span style={{fontSize:'9px',background:'#ef444420',color:'#ef4444',border:'1px solid #ef444440',borderRadius:'20px',padding:'1px 7px'}}>urgente</span>}</div>
              <p style={{fontSize:'11px',color:'#94a3b8',lineHeight:'1.5'}}>{a.resultado_json?.resumo?.slice(0,150)}...</p>
            </div>))}
          </div>}
          {screen==='new'&&sel&&<div className="fin">
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px'}}>
              <button className="sbtn" onClick={()=>{setScreen('patient');setResult(null);setCaseText('')}}>Voltar</button>
              <div><div style={{fontSize:'13px',fontWeight:600,color:'#f1f5f9'}}>Nova analise</div><div style={{fontSize:'10px',color:'#64748b'}}>{sel.nome}</div></div>
            </div>
            <div className="card">
              <div style={{fontSize:'10px',color:'#38bdf8',letterSpacing:'0.12em',textTransform:'uppercase',fontWeight:700,marginBottom:'9px'}}>Caso Clinico</div>
              <textarea value={caseText} onChange={e=>setCaseText(e.target.value)} placeholder="Digite ou dite o caso pelo microfone do teclado..." className="inp" style={{minHeight:'100px',resize:'vertical',lineHeight:'1.6',padding:'9px'}}/>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'9px',gap:'8px'}}>
                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                  <button onClick={toggleMic} style={{background:isRec?'#ef4444':'#1e293b',border:'none',borderRadius:'50%',width:'36px',height:'36px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    {isRec
                      ? <span style={{color:'#fff',fontSize:'10px',fontWeight:700}}>■</span>
                      : <span style={{color:'#94a3b8',fontSize:'16px'}}>🎙</span>
                    }
                  </button>
                  {isRec&&<span style={{fontSize:'10px',color:'#ef4444'}}>● Gravando...</span>}
                  {micErr&&<span style={{fontSize:'10px',color:'#f59e0b'}}>{micErr}</span>}
                  {!isRec&&!micErr&&<span style={{fontSize:'10px',color:'#334155'}}>{caseText.length} chars</span>}
                </div>
                <button className="btn2" onClick={analyze} disabled={loading||caseText.trim().length<10} style={{opacity:loading||caseText.trim().length<10?0.4:1}}>{loading?'Analisando...':'Analisar caso'}</button>
              </div>
            </div>
            {err&&<div style={{background:'#450a0a',border:'1px solid #ef444460',borderRadius:'6px',padding:'10px 14px',marginBottom:'10px',fontSize:'11px',color:'#fda4af',wordBreak:'break-all'}}>ERRO: {err}</div>}
            {saved&&<div style={{background:'#022c22',border:'1px solid #14532d',borderRadius:'6px',padding:'9px 12px',marginBottom:'10px',fontSize:'11px',color:'#86efac'}}>{saved}</div>}
            {loading&&<div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'36px',gap:'12px'}}><div style={{width:'32px',height:'32px',border:'3px solid #1e293b',borderTop:'3px solid #0ea5e9',borderRadius:'50%',animation:'spin 1s linear infinite'}}/><span style={{color:'#475569',fontSize:'11px'}}>PROCESSANDO...</span></div>}
            {result&&!loading&&<Result data={result} onPDF={()=>setShowPDF(true)}/>}
          </div>}
          {screen==='detail'&&selA&&<div className="fin">
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px',flexWrap:'wrap'}}>
              <button className="sbtn" onClick={()=>{setScreen('patient');setSelA(null);setResult(null)}}>Voltar</button>
              <div style={{flex:1}}><div style={{fontSize:'13px',fontWeight:600,color:'#f1f5f9'}}>{sel?.nome}</div><div style={{fontSize:'10px',color:'#64748b'}}>{fmt(selA.created_at)}</div></div>
              <button className="btn" onClick={()=>setShowPDF(true)}>PDF</button>
            </div>
            <Result data={selA.resultado_json} onPDF={()=>setShowPDF(true)}/>
          </div>}
          {screen==='dashboard'&&sel&&<div className="fin">
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'14px'}}>
              <button className="sbtn" onClick={()=>setScreen('patient')}>Voltar</button>
              <div style={{fontSize:'13px',fontWeight:600,color:'#f1f5f9'}}>Dashboard — {sel.nome}</div>
            </div>
            {patA.length===0
              ? <div style={{textAlign:'center',padding:'32px',color:'#475569',fontSize:'12px'}}>Nenhuma analise ainda.</div>
              : (function(){
                  var lat=patA[0].resultado_json||{};
                  var sv=lat.paciente&&lat.paciente.sinais_vitais||{};
                  var qpts=lat.sepse&&lat.sepse.qsofa&&lat.sepse.qsofa.pontos||0;
                  var icRaw=lat.sepse&&lat.sepse.indice_choque&&lat.sepse.indice_choque.valor||'';var ic=parseFloat(String(icRaw).match(/\d+\.?\d*/)||'0')?String(parseFloat(String(icRaw).match(/\d+\.?\d*/)||'0')):icRaw;
                  var icn=parseFloat(ic)||0;
                  var flags=(lat.red_flags||[]).slice(0,4);
                  var hip=(lat.hipoteses||[])[0];
                  var passo=(lat.passos||[])[0];
                  var sc=qpts>=2||icn>=1||lat.urgente;
                  var scolor=sc?'#ef4444':qpts>=1?'#f59e0b':'#22c55e';
                  var slabel=sc?'ATENCAO IMEDIATA':qpts>=1?'MONITORAR':'ESTAVEL';
                  var dfmt=patA[0].created_at?new Date(patA[0].created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
                  var VT=[{k:'FC',l:'FC',bad:function(v){return v>100||v<50;}},{k:'PAS',l:'PAS',bad:function(v){return v<90;}},{k:'FR',l:'FR',bad:function(v){return v>=22;}},{k:'SpO2',l:'SpO2',bad:function(v){return v<90;}},{k:'Glasgow',l:'GCS',bad:function(v){return v<13;}}];
                  return (<div>
                    <div style={{background:scolor+'15',border:'1px solid '+scolor+'40',borderRadius:'10px',padding:'10px 14px',marginBottom:'12px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontWeight:700,fontSize:'12px',color:scolor}}>{slabel}</span>
                      <div style={{display:'flex',gap:'12px'}}>
                        <div style={{textAlign:'center'}}><div style={{fontSize:'9px',color:'#64748b'}}>qSOFA</div><div style={{fontSize:'16px',fontWeight:700,color:qpts>=2?'#ef4444':'#22c55e'}}>{qpts}/3</div></div>
                        {ic&&<div style={{textAlign:'center'}}><div style={{fontSize:'9px',color:'#64748b'}}>IND.CHOQUE</div><div style={{fontSize:'16px',fontWeight:700,color:icn>=1?'#ef4444':'#22c55e'}}>{ic}</div></div>}
                        <div style={{fontSize:'10px',color:'#475569'}}>{dfmt}</div>
                      </div>
                    </div>
                    <div style={{background:'#0f172a',border:'1px solid #1e293b',borderRadius:'10px',padding:'12px',marginBottom:'12px'}}>
                      <div style={{fontSize:'9px',color:'#64748b',letterSpacing:'0.1em',marginBottom:'10px'}}>SINAIS VITAIS</div>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'6px'}}>{VT.map(function(v){var val=sv[v.k];if(!val)return null;var bad=v.bad(parseFloat(val));var col=bad?'#ef4444':'#94a3b8';return(<div key={v.k} style={{background:'#020617',border:'1px solid '+(bad?'#ef444430':'#1e293b'),borderRadius:'7px',padding:'8px',textAlign:'center'}}><div style={{fontSize:'8px',color:'#475569',marginBottom:'2px'}}>{v.l}</div><div style={{fontSize:'15px',fontWeight:700,color:col}}>{val}</div></div>);})}</div>
                    </div>
                    <VitalChart sv={sv}/>
                    {flags.length>0&&<div style={{background:'#0f172a',border:'1px solid #ef444430',borderLeft:'3px solid #ef4444',borderRadius:'10px',padding:'12px',marginBottom:'12px'}}>
                      <div style={{fontSize:'9px',color:'#ef4444',fontWeight:700,marginBottom:'8px'}}>RED FLAGS</div>
                      {flags.map(function(f,i){return(<div key={i} style={{fontSize:'11px',color:'#fca5a5',padding:'3px 0'}}>! {f}</div>);})}
                    </div>}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
                      {hip&&<div style={{background:'#0f172a',border:'1px solid #818cf830',borderLeft:'3px solid #818cf8',borderRadius:'10px',padding:'12px'}}><div style={{fontSize:'9px',color:'#818cf8',fontWeight:700,marginBottom:'6px'}}>HIPOTESE PRINCIPAL</div><div style={{fontSize:'12px',color:'#f1f5f9',fontWeight:600}}>{hip.nome}</div></div>}
                      {passo&&<div style={{background:'#0f172a',border:'1px solid #34d39930',borderLeft:'3px solid #34d399',borderRadius:'10px',padding:'12px'}}><div style={{fontSize:'9px',color:'#34d399',fontWeight:700,marginBottom:'6px'}}>PROXIMO PASSO</div><div style={{fontSize:'11px',color:'#86efac',lineHeight:'1.5'}}>{passo}</div></div>}
                    </div>
                  </div>);
                })()
            }
          </div>}

          {screen==='evolution'&&sel&&<div className="fin">
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px'}}>
              <button className="sbtn" onClick={()=>setScreen('patient')}>Voltar</button>
              <div style={{fontSize:'13px',fontWeight:600,color:'#f1f5f9'}}>{sel.nome}</div>
            </div>
            {patA.length<2&&<div style={{textAlign:'center',padding:'32px',color:'#475569',fontSize:'12px'}}>Sao necessarias pelo menos 2 analises.</div>}
            {[...patA].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map((a,i,arr)=>{
              const isLast=i===arr.length-1,curr=a.resultado_json,sv=curr?.paciente?.sinais_vitais||{};
              return(<div key={a.id} style={{display:'flex',gap:'12px',marginBottom:'6px'}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',flexShrink:0}}>
                  <div style={{width:'10px',height:'10px',borderRadius:'50%',background:isLast?'#22c55e':'#38bdf8',marginTop:'12px'}}/>
                  {!isLast&&<div style={{width:'2px',flex:1,background:'#1e293b',marginTop:'3px'}}/>}
                </div>
                <div style={{flex:1,background:'#0f172a',border:'1px solid #1e293b',borderRadius:'7px',padding:'12px',marginBottom:'3px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:'7px'}}>
                    <span style={{fontSize:'11px',color:'#64748b'}}>{fmt(a.created_at)}</span>
                    {isLast&&<span style={{fontSize:'9px',background:'#22c55e20',color:'#22c55e',border:'1px solid #22c55e40',borderRadius:'20px',padding:'1px 7px'}}>atual</span>}
                  </div>
                  <p style={{fontSize:'11px',color:'#94a3b8',lineHeight:'1.5',marginBottom:'8px'}}>{curr?.resumo?.slice(0,140)}...</p>
                  {Object.keys(sv).length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:'5px'}}>{Object.entries(sv).map(([k,v])=>(<div key={k} style={{background:'#020617',border:'1px solid #1e293b',borderRadius:'5px',padding:'3px 9px',textAlign:'center',minWidth:'55px'}}><div style={{fontSize:'8px',color:'#64748b'}}>{k.toUpperCase()}</div><div style={{fontSize:'11px',fontWeight:700,color:'#38bdf8'}}>{v}</div></div>))}</div>}
                </div>
              </div>);
            })}
          </div>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
