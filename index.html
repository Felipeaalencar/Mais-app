const {useState,useEffect} = React;

// Hook para detectar mobile
function useIsMobile(){
  var[isMobile,setIsMobile]=useState(function(){
    if(typeof window==='undefined')return false;
    return window.innerWidth<=640;
  });
  useEffect(function(){
    function onResize(){setIsMobile(window.innerWidth<=640);}
    window.addEventListener('resize',onResize);
    return function(){window.removeEventListener('resize',onResize);};
  },[]);
  return isMobile;
}

const SUPA_URL = 'https://xyyhxxaxmyicvgijcqau.supabase.co';

// Fetch com retry automatico para timeouts do Vercel/Anthropic
// Tenta no maximo 2x; se a 1a tentativa der timeout/504/502/503, tenta de novo
async function fetchWithRetry(url, options, opts){
  opts = opts || {};
  var maxRetries = opts.maxRetries || 3; // 3 retries = 4 tentativas no total
  var onRetry = opts.onRetry || function(){};
  var attempt = 0;
  var lastError = null;
  while(attempt <= maxRetries){
    try{
      var res = await fetch(url, options);
      // 504/502/503 = problemas transientes do gateway - vale tentar de novo
      if((res.status===504||res.status===502||res.status===503)&&attempt<maxRetries){
        attempt++;
        onRetry(attempt, 'gateway-error');
        continue;
      }
      return res;
    }catch(err){
      lastError = err;
      // Erros de rede - vale tentar de novo
      if(attempt<maxRetries){
        attempt++;
        onRetry(attempt, 'network-error');
        continue;
      }
      throw err;
    }
  }
  if(lastError)throw lastError;
  throw new Error('Falha apos '+(maxRetries+1)+' tentativas');
}

function fixJSON(s){
  s=s.replace(/```json|```/gi,'').trim();
  try{return JSON.parse(s)}catch(e){}
  const lc=Math.max(s.lastIndexOf(',"'),s.lastIndexOf(',\n'));
  if(lc>s.length*0.5)s=s.substring(0,lc);
  const st=[];let inS=false,es=false;
  for(let i=0;i<s.length;i++){const c=s[i];if(es){es=false;continue}if(c==='\\'&&inS){es=true;continue}if(c==='"'){inS=!inS;continue}if(!inS){if(c==='{'||c==='[')st.push(c==='{'?'}':']');if(c==='}'||c===']')st.pop()}}
  while(st.length)s+=st.pop();
  try{return JSON.parse(s)}catch(e){return null}
}

function buildReport(data,paciente,createdAt){
  const now=createdAt?fmt(createdAt):new Date().toLocaleString('pt-BR');
  const sv=data.paciente?.sinais_vitais||{};const sbar=data.sbar||{};const L=[];
  L.push('MAIS — inteligencia clinica');L.push('================================');
  if(paciente){L.push('Paciente: '+(paciente.nome||''));if(paciente.leito)L.push('Leito: '+paciente.leito);if(paciente.setor)L.push('Setor: '+paciente.setor);}
  L.push('Data: '+now);L.push('');
  if(data.resumo){L.push('RESUMO');L.push(data.resumo);L.push('');}
  if(Object.keys(sv).length>0){L.push('SINAIS VITAIS');Object.entries(sv).forEach(([k,v])=>L.push(k+': '+v));L.push('');}
  const q=data.sepse?.qsofa;if(q){L.push('qSOFA: '+(q.pontos??0)+'/3 — '+(q.risco||''));L.push('');}
  if((data.hipoteses||[]).length>0){L.push('HIPOTESES');(data.hipoteses||[]).forEach((h,i)=>L.push((i+1)+'. '+h.nome+' ('+h.prob+')'));L.push('');}
  if((data.red_flags||[]).length>0){L.push('RED FLAGS');(data.red_flags||[]).forEach(f=>L.push('! '+f));L.push('');}
  if((data.passos||[]).length>0){L.push('PROXIMOS PASSOS');(data.passos||[]).forEach((p,i)=>L.push((i+1)+'. '+p));L.push('');}
  if(sbar.situacao||sbar.background){L.push('SBAR');if(sbar.situacao)L.push('S: '+sbar.situacao);if(sbar.background)L.push('B: '+sbar.background);if(sbar.avaliacao)L.push('A: '+sbar.avaliacao);if(sbar.recomendacao)L.push('R: '+sbar.recomendacao);L.push('');}
  if((data.checklist||[]).length>0){L.push('CHECKLIST');(data.checklist||[]).forEach(c=>L.push('☐ '+c));L.push('');}
  L.push('================================');L.push('Nao substitui julgamento medico.');
  return L.join('\n');
}

// Renderiza markdown para impressao (sumario no PDF)
function renderMDForPrint(text){
  if(!text)return null;
  var lines=text.split('\n');
  var out=[];
  function renderInline(s){
    var parts=[];var rest=s;var idx=0;
    while(rest.length>0){
      var m=rest.match(/\*\*([^*]+)\*\*/);
      if(!m){parts.push(<span key={idx++}>{rest}</span>);break;}
      if(m.index>0)parts.push(<span key={idx++}>{rest.substring(0,m.index)}</span>);
      parts.push(<strong key={idx++}>{m[1]}</strong>);
      rest=rest.substring(m.index+m[0].length);
    }
    return parts;
  }
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(/^##\s+/.test(ln)){
      out.push(<h2 key={i} style={{fontSize:'18px',margin:'14px 0 6px',color:'#FFFFFF',fontWeight:700}}>{ln.replace(/^##\s+/,'')}</h2>);
    }else if(/^###\s+/.test(ln)){
      out.push(<h3 key={i} style={{fontSize:'14px',margin:'10px 0 4px',color:'#1D9E75',fontWeight:700}}>{ln.replace(/^###\s+/,'')}</h3>);
    }else if(/^\s*-\s+/.test(ln)){
      out.push(<div key={i} style={{fontSize:'12px',lineHeight:1.6,marginBottom:'3px',paddingLeft:'12px'}}>• {renderInline(ln.replace(/^\s*-\s+/,''))}</div>);
    }else if(ln.trim()===''){

function VitalChart({sv}){

  }).map(function(e){
    var key=e[0],range=e[1];
    var raw=Object.keys(sv).reduce(function(found,sk){
      if(sk.toLowerCase().includes(key.toLowerCase())||key.toLowerCase().includes(sk.toLowerCase()))return sv[sk];

// Renderizador leve de markdown para mensagens do consultor
function renderMD(text){
  if(!text)return null;
  var lines=text.split('\n');
  var out=[];
  var listBuf=[];
  function renderInline(s){
    var parts=[];var rest=s;var idx=0;
    while(rest.length>0){
      var m=rest.match(/\*\*([^*]+)\*\*/);
      if(!m){parts.push(<span key={idx++}>{rest}</span>);break;}
      if(m.index>0)parts.push(<span key={idx++}>{rest.substring(0,m.index)}</span>);
      parts.push(<strong key={idx++} style={{color:'#34d399',fontWeight:700}}>{m[1]}</strong>);
      rest=rest.substring(m.index+m[0].length);
    }
    return parts;
  }
  function flushList(){
    if(listBuf.length>0){
      var items=listBuf.slice();
      out.push(<ul key={'ul'+out.length} style={{margin:'4px 0 8px',paddingLeft:'18px'}}>{items.map(function(item,i){return <li key={i} style={{marginBottom:'3px',lineHeight:1.6}}>{renderInline(item)}</li>;})}</ul>);
      listBuf=[];
    }
  }
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(/^\s*[-*]\s+/.test(ln)){listBuf.push(ln.replace(/^\s*[-*]\s+/,''));continue;}
    flushList();
    if(/^#{1,3}\s+/.test(ln)){
      out.push(<div key={'h'+i} style={{fontWeight:700,color:'#34d399',marginTop:i>0?'10px':0,marginBottom:'4px',fontSize:'12px'}}>{ln.replace(/^#{1,3}\s+/,'')}</div>);
    }else if(ln.trim()===''){
      if(out.length>0)out.push(<div key={'br'+i} style={{height:'6px'}}/>);
    }else{
      out.push(<div key={'p'+i} style={{lineHeight:1.6,marginBottom:'4px'}}>{renderInline(ln)}</div>);
    }
  }
  flushList();
  return out;
}

const COMPRESS_MAX_DIM = 1280;
const COMPRESS_QUALITY = 0.82;

function compressImage(file) {
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > COMPRESS_MAX_DIM || h > COMPRESS_MAX_DIM) {
          if (w > h) { h = Math.round(h * COMPRESS_MAX_DIM / w); w = COMPRESS_MAX_DIM; }
          else { w = Math.round(w * COMPRESS_MAX_DIM / h); h = COMPRESS_MAX_DIM; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', COMPRESS_QUALITY);
        var base64 = dataUrl.split(',')[1];
        resolve({ base64: base64, media_type: 'image/jpeg', size: Math.round(base64.length * 0.75) });
      };
      img.onerror = function(){ reject(new Error('Erro ao processar imagem')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('Erro ao ler arquivo')); };
    reader.readAsDataURL(file);
  });
}

function readPdfAsBase64(file) {
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var base64 = e.target.result.split(',')[1];
      resolve({ base64: base64, media_type: 'application/pdf', size: file.size });
    };
    reader.onerror = function(){ reject(new Error('Erro ao ler PDF')); };
    reader.readAsDataURL(file);
  });
}

  {b:3,k:'glasgow',l:'Glasgow (menor)',tipo:'num',exame:false,pts:function(v){return v>=13?0:v>=7?2:v===6?7:v===5?10:15;}},
  {b:3,k:'fc',l:'FC max (bpm)',tipo:'num',exame:false,pts:function(v){return v<120?0:v<160?5:7;}},
  {b:3,k:'pas',l:'PAS min (mmHg)',tipo:'num',exame:false,pts:function(v){return v>=120?0:v>=70?3:v>=40?8:11;}},
  {b:3,k:'temp',l:'Temperatura max (C)',tipo:'num',exame:false,pts:function(v){return v>=35?0:7;}},
  {b:3,k:'oxi',l:'Oxigenacao',tipo:'sel',exame:false,opts:[{v:'a',l:'PaO2>=60 sem VM',p:0},{v:'b',l:'PaO2<60 sem VM',p:5},{v:'c',l:'PaO2/FiO2>=100 c/VM',p:7},{v:'d',l:'PaO2/FiO2<100 c/VM',p:11}]},
  {b:3,k:'creat',l:'Creatinina max (mg/dL)',tipo:'num',exame:true,pts:function(v){return v<1.2?0:v<2?2:v<3.5?7:8;}},
  {b:3,k:'bili',l:'Bilirrubina max (mg/dL)',tipo:'num',exame:true,pts:function(v){return v<2?0:v<6?4:5;}},
  {b:3,k:'leuco',l:'Leucocitos max (G/L)',tipo:'num',exame:true,pts:function(v){return v<15?0:2;}},
  {b:3,k:'plaq',l:'Plaquetas min (G/L)',tipo:'num',exame:true,pts:function(v){return v>=100?0:v>=50?5:v>=20?8:13;}},
  {b:3,k:'ph',l:'pH min',tipo:'num',exame:true,pts:function(v){return v>7.25?0:3;}},
];
// Calcula escore a partir do objeto de dados {k:valor}. Faltante conta 0 (regra oficial).
function saps3Calc(dados){
  var total=SAPS3_OFFSET, preenchidos=0;
  SAPS3_VARS.forEach(function(vr){
    var val=dados[vr.k];
    if(val===undefined||val===null||val===''){return;} // falta = 0 pts
    preenchidos++;
    if(vr.tipo==='num'){var n=parseFloat(String(val).replace(',','.'));if(!isNaN(n))total+=vr.pts(n);}
    else if(vr.tipo==='sel'){var o=vr.opts.find(function(x){return x.v===val;});if(o)total+=o.p;}
    else if(vr.tipo==='multi'){(val||[]).forEach(function(mv){var o=vr.opts.find(function(x){return x.v===mv;});if(o)total+=o.p;});preenchidos--;if((val||[]).length>0)preenchidos++;}
  });
  return {score:total,mortalidade:saps3Mortalidade(total),preenchidos:preenchidos,total:SAPS3_VARS.length};
}


function SAPS3Form({paciente,ultimaAnalise,todasAnalises,onClose,onSave}){
  var dadosIniciais=(paciente&&paciente.saps3_dados)||{};
  var [dados,setDados]=useState(dadosIniciais);
  var [salvando,setSalvando]=useState(false);
  var [iaLoading,setIaLoading]=useState(false);
  // admissao: usa saps3_admissao_em existente ou created_at do paciente
  var admissaoEm=paciente&&(paciente.saps3_admissao_em||paciente.created_at);
  var minsAdmissao=admissaoEm?Math.floor((Date.now()-new Date(admissaoEm).getTime())/60000):0;
  var foraJanela=minsAdmissao>60;

  function setCampo(k,v){setDados(function(p){var n=Object.assign({},p);n[k]=v;return n;});}
  function toggleMulti(k,mv){setDados(function(p){var arr=(p[k]||[]).slice();var i=arr.indexOf(mv);if(i>=0)arr.splice(i,1);else arr.push(mv);var n=Object.assign({},p);n[k]=arr;return n;});}

  var calc=saps3Calc(dados);
  var completo=calc.preenchidos>=SAPS3_VARS.length;
  var status=calc.preenchidos===0?'pendente':completo?'completo':'parcial';
  var statusCor={pendente:'#9A9A97',parcial:'#C98A00',completo:'#1E9E63'}[status];
  var statusBg={pendente:'#EDEDEA',parcial:'#FBF2DC',completo:'#E7F5EE'}[status];

  // pré-preenchimento via IA a partir da última análise
  async function preencherIA(){
    // usa todas as análises se disponível; senão, cai pra última
    var lista=(todasAnalises&&todasAnalises.length)?todasAnalises:(ultimaAnalise?[ultimaAnalise]:[]);
    lista=lista.filter(function(a){return a&&a.resultado_json;});
    if(!lista.length){alert('Sem análise para extrair. Faça uma análise clínica primeiro.');return;}
    setIaLoading(true);
    try{
      var novo=Object.assign({},dados);
      // helper: só preenche se ainda estiver vazio (mantém o que já foi digitado)
      function setSe(campo,valor){
        if(valor===undefined||valor===null||valor==='')return;
        if(novo[campo]===undefined||novo[campo]===null||novo[campo]===''){novo[campo]=String(valor);}
      }
      // percorre da mais RECENTE pra mais antiga; o primeiro valor achado (mais recente) vence
      lista.forEach(function(a){
        var rj=a.resultado_json; if(!rj)return;
        var sv=(rj.paciente&&rj.paciente.sinais_vitais)||{};
        if(sv.FC)setSe('fc',parseFloat(sv.FC)||'');
        if(sv.PAS)setSe('pas',parseFloat(sv.PAS)||'');
        if(sv.Glasgow)setSe('glasgow',parseFloat(sv.Glasgow)||'');
        if(sv.Temperatura)setSe('temp',parseFloat(sv.Temperatura)||'');
        if(rj.paciente&&rj.paciente.idade){var id=parseInt(rj.paciente.idade);if(!isNaN(id))setSe('idade',id);}
        var hip=(rj.hipoteses&&rj.hipoteses[0]&&rj.hipoteses[0].nome||'').toLowerCase();
        if((hip.indexOf('sepse')>=0||hip.indexOf('séptico')>=0||hip.indexOf('septico')>=0))setSe('motivo','septico');
      });
      setDados(novo);
    }catch(e){alert('Erro ao extrair: '+e.message);}
    finally{setIaLoading(false);}
  }

  async function salvar(){
    setSalvando(true);
    try{
      var payload={
        saps3_dados:dados,
        saps3_status:status,
        saps3_score:calc.score,
        saps3_mortalidade:Math.round(calc.mortalidade*10)/10
      };
      if(!paciente.saps3_score_admissao)payload.saps3_score_admissao=calc.score;
      if(!paciente.saps3_admissao_em)payload.saps3_admissao_em=new Date(admissaoEm||Date.now()).toISOString();
      if(completo&&!paciente.saps3_completo_em)payload.saps3_completo_em=new Date().toISOString();
      await onSave(payload);
    }finally{setSalvando(false);}
  }

  function renderCampo(vr){
    var val=dados[vr.k];
    var preenchido=vr.tipo==='multi'?(val&&val.length>0):(val!==undefined&&val!==null&&val!=='');
    var isExame=vr.exame===true;
    return(<div key={vr.k} style={{marginBottom:'11px'}}>
      <div style={{fontSize:'11px',color:'#6B6F76',marginBottom:'5px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{vr.l}</span>
        {preenchido?<span style={{fontSize:'8px',background:'#E7F5EE',color:'#1E9E63',borderRadius:'3px',padding:'1px 6px',fontWeight:700}}>ok</span>
          :<span style={{fontSize:'8px',background:'#FBF2DC',color:'#C98A00',borderRadius:'3px',padding:'1px 6px',fontWeight:700}}>{isExame?'exame':'falta'}</span>}
      </div>
      {vr.tipo==='num'&&<input type="number" value={val||''} onChange={function(e){setCampo(vr.k,e.target.value);}} placeholder={isExame?'aguardando exame (conta 0)':'-'} style={{width:'100%',borderRadius:'7px',padding:'9px 10px',fontSize:'12px',fontFamily:'monospace',border:'1px solid '+(preenchido?'#1E9E63':'#E7E7E4'),background:preenchido?'#E7F5EE':'#F5F5F3',color:'#111'}}/>}
      {vr.tipo==='sel'&&<select value={val||''} onChange={function(e){setCampo(vr.k,e.target.value);}} style={{width:'100%',borderRadius:'7px',padding:'9px 10px',fontSize:'12px',fontFamily:'monospace',border:'1px solid '+(preenchido?'#1E9E63':'#E7E7E4'),background:preenchido?'#E7F5EE':'#F5F5F3',color:'#111'}}>
        <option value="">- selecionar -</option>
        {vr.opts.map(function(o){return(<option key={o.v} value={o.v}>{o.l} ({o.p>=0?'+':''}{o.p})</option>);})}
      </select>}
      {vr.tipo==='multi'&&<div style={{display:'flex',flexWrap:'wrap',gap:'5px'}}>
        {vr.opts.map(function(o){var on=(val||[]).indexOf(o.v)>=0;return(<button key={o.v} onClick={function(){toggleMulti(vr.k,o.v);}} style={{fontSize:'10px',padding:'5px 9px',borderRadius:'6px',cursor:'pointer',fontFamily:'monospace',border:'1px solid '+(on?'#1E9E63':'#E7E7E4'),background:on?'#E7F5EE':'#F5F5F3',color:on?'#1E7A4E':'#6B6F76',fontWeight:on?700:400}}>{o.l} +{o.p}</button>);})}
      </div>}
    </div>);
  }

  var blocos=[{n:1,t:'BLOCO I · CARACTERISTICAS PREVIAS'},{n:2,t:'BLOCO II · CIRCUNSTANCIAS DA ADMISSAO'},{n:3,t:'BLOCO III · FISIOLOGIA (1a HORA)'}];

  return(<div style={{position:'fixed',inset:0,background:'rgba(2,6,23,0.5)',zIndex:400,display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'16px',overflowY:'auto'}} onClick={function(e){if(e.target===e.currentTarget)onClose();}}>
    <div style={{width:'100%',maxWidth:'480px',background:'#F5F5F3',borderRadius:'14px',overflow:'hidden',marginTop:'8px',marginBottom:'40px'}}>
      {/* header */}
      <div style={{background:'#FFFFFF',borderBottom:'1px solid #E7E7E4',padding:'14px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',position:'sticky',top:0,zIndex:2}}>
        <div><div style={{fontSize:'14px',fontWeight:700,color:'#111'}}>SAPS 3 — Admissao</div><div style={{fontSize:'10px',color:'#9A9A97'}}>{paciente.nome}{paciente.leito?' · '+paciente.leito:''}</div></div>
        <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
          <span style={{fontSize:'10px',fontWeight:700,padding:'3px 11px',borderRadius:'999px',background:statusBg,color:statusCor}}>● {status.toUpperCase()}</span>
          <button onClick={onClose} style={{background:'transparent',border:'none',color:'#9A9A97',fontSize:'20px',cursor:'pointer',lineHeight:1}}>×</button>
        </div>
      </div>
      <div style={{padding:'16px'}}>
        {/* resultado ao vivo */}
        <div style={{background:'#111',color:'#fff',borderRadius:'12px',padding:'16px',marginBottom:'12px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
            <div><div style={{fontSize:'34px',fontWeight:700,lineHeight:1,color:completo?'#5FD08A':'#F4C453'}}>{calc.score}</div><div style={{fontSize:'9px',color:'#8f8f8c',marginTop:'4px'}}>SAPS 3{completo?'':' PROVISORIO'}</div></div>
            <div style={{textAlign:'right'}}><div style={{fontSize:'24px',fontWeight:700,lineHeight:1,color:completo?'#5FD08A':'#F4C453'}}>{calc.mortalidade.toFixed(1)}%</div><div style={{fontSize:'9px',color:'#8f8f8c',marginTop:'4px'}}>MORTALIDADE EST.</div></div>
          </div>
          {!completo&&<div style={{background:'rgba(244,196,83,.15)',border:'1px solid rgba(244,196,83,.4)',borderRadius:'7px',padding:'8px 10px',marginTop:'12px',fontSize:'10px',color:'#F4C453',lineHeight:1.5}}>⚠ Provisorio — {SAPS3_VARS.length-calc.preenchidos} campo(s) sem valor contam 0. <b>Tende a aumentar</b> conforme preencher.</div>}
          <div style={{fontSize:'9px',color:'#6B6F76',marginTop:'10px'}}>{calc.preenchidos}/{SAPS3_VARS.length} campos · admissao ha {minsAdmissao<60?minsAdmissao+' min':Math.floor(minsAdmissao/60)+'h'} {foraJanela?'· ⚠ fora da janela de 1h':'· dentro da janela ✓'}</div>
        </div>
        {/* botão IA */}
        <button onClick={preencherIA} disabled={iaLoading} style={{width:'100%',background:'#E7F5EE',border:'1px solid #A9DcC0',color:'#1E7A4E',padding:'10px',borderRadius:'8px',fontWeight:700,fontSize:'12px',fontFamily:'monospace',marginBottom:'12px',cursor:'pointer'}}>{iaLoading?'Extraindo...':'✨ Preencher com as analises'}</button>
        {/* blocos */}
        {blocos.map(function(bl){
          return(<div key={bl.n} style={{background:'#FFFFFF',border:'1px solid #E7E7E4',borderRadius:'12px',padding:'14px',marginBottom:'12px'}}>
            <div style={{fontSize:'10px',letterSpacing:'0.1em',color:'#374151',fontWeight:700,marginBottom:'12px'}}>{bl.t}</div>
            {SAPS3_VARS.filter(function(v){return v.b===bl.n;}).map(renderCampo)}
          </div>);
        })}
        {/* ações */}
        <div style={{display:'flex',gap:'8px'}}>
          <button onClick={onClose} style={{flex:1,background:'#F5F5F3',border:'1px solid #E7E7E4',color:'#6B6F76',padding:'12px',borderRadius:'8px',fontWeight:700,fontSize:'12px',fontFamily:'monospace',cursor:'pointer'}}>Cancelar</button>
          <button onClick={salvar} disabled={salvando} style={{flex:2,background:'#1D9E75',border:'none',color:'#fff',padding:'12px',borderRadius:'8px',fontWeight:700,fontSize:'12px',fontFamily:'monospace',cursor:'pointer',opacity:salvando?0.6:1}}>{salvando?'Salvando...':'Salvar SAPS 3 ('+calc.score+')'}</button>
        </div>
        <div style={{fontSize:'9px',color:'#9A9A97',textAlign:'center',marginTop:'10px',lineHeight:1.5}}>Equacao global validada · nao substitui julgamento clinico · pontos a validar pela equipe</div>
      </div>
    </div>
  </div>);
}

  async function sendConsult(){
    var txt=consultInput.trim();
    if(!txt||consultLoading)return;
    var userMsg={role:'user',content:txt,t:Date.now()};
    var newMsgs=consultMsgs.concat([userMsg]);
    setConsultMsgs(newMsgs);
    setConsultInput('');
    setConsultLoading(true);
    // Monta system prompt + contexto do paciente se solicitado

    if(consultIncludePat&&sel){
      var ctxParts=['Contexto do paciente atual:','Nome: '+sel.nome];
      if(sel.leito)ctxParts.push('Leito: '+sel.leito);
      if(sel.setor)ctxParts.push('Setor: '+sel.setor);
      if(sel.status_clinico)ctxParts.push('Status: '+sel.status_clinico);
      var lastA=(analyses[sel.id]||[])[0];
      if(lastA&&lastA.resultado_json){

        if(rj.hipoteses&&rj.hipoteses[0])ctxParts.push('Hipotese principal: '+rj.hipoteses[0].nome);

        }
      }
      system=system+'\n\n'+ctxParts.join('\n');
    }
    // Pega ultimas 8 mensagens (4 trocas) + a nova
    var historyForApi=newMsgs.slice(-8).map(function(m){return{role:m.role,content:m.content};});
    try{
      var res=await fetchWithRetry('/api/analyze',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({mode:'consult',messages:historyForApi,system:system})
      });

      var data=await res.json();
      if(data.error)throw new Error(data.error);
      var raw=(data.content||[]).map(function(b){return b.type==='text'?b.text:'';}).join('')||'';
      if(!raw.trim())throw new Error('Resposta vazia.');
      setConsultMsgs(function(prev){return prev.concat([{role:'assistant',content:raw,t:Date.now()}]);});
    }catch(e){
      setConsultMsgs(function(prev){return prev.concat([{role:'assistant',content:'**Erro:** '+e.message+'\n\nTente novamente em alguns segundos.',t:Date.now(),isError:true}]);});
    }finally{
      setConsultLoading(false);
    }
  }

  function toggleMic(){
    setMicErr("");
    if(isRec){if(recRef.current)recRef.current.stop();setIsRec(false);return;}
    // Detecta iOS (Safari/Chrome no iPhone/iPad)
    var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR||isIOS){
      setMicErr(isIOS?"No iPhone, use o microfone do teclado (icone do microfone ao lado da barra de espaco)":"Reconhecimento de voz nao suportado neste navegador. Use o microfone do teclado.");
      return;
    }
    var r=new SR();r.lang="pt-BR";r.continuous=true;r.interimResults=true;
    r.onstart=function(){setIsRec(true);};
    r.onend=function(){setIsRec(false);};
    r.onerror=function(e){
      setIsRec(false);
      var msg=e.error;
      if(msg==='not-allowed')msg='Permissao negada. Use o microfone do teclado do celular.';
      else if(msg==='no-speech')msg='Nenhuma voz detectada. Tente falar mais alto.';
      else if(msg==='network')msg='Sem internet para reconhecer voz.';
      else if(msg==='aborted')msg='Gravacao cancelada.';
      setMicErr(msg);
    };
    r.onresult=function(e){var t="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)t+=e.results[i][0].transcript+" ";}if(t)setCaseText(function(prev){return (prev+t).trim()+" ";});};
    recRef.current=r;
    try{r.start();}catch(err){setMicErr('Erro ao iniciar: '+err.message);}
  }

  async function handleFiles(filesList){
    setAttachErr('');
    var files = Array.from(filesList);
    if (attachments.length + files.length > MAX_ATTACHMENTS) {
      setAttachErr('Maximo '+MAX_ATTACHMENTS+' anexos. Voce ja tem '+attachments.length+'.');
      return;
    }
    var newAttachments = [];
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      if (file.size > MAX_FILE_SIZE) {
        setAttachErr('Arquivo "'+file.name+'" excede 5MB ('+fmtBytes(file.size)+').');
        continue;
      }
      var isImage = file.type.startsWith('image/');
      var isPdf = file.type === 'application/pdf';
      if (!isImage && !isPdf) {
        setAttachErr('Tipo nao suportado: '+file.name+'. Apenas imagens e PDF.');
        continue;
      }
      try {
        var processed = isImage ? await compressImage(file) : await readPdfAsBase64(file);
        newAttachments.push({
          name: file.name,
          type: isImage ? 'image' : 'pdf',
          media_type: processed.media_type,
          base64: processed.base64,
          size: processed.size
        });
      } catch (e) {
        setAttachErr('Erro ao processar "'+file.name+'": '+e.message);
      }
    }
    if (newAttachments.length > 0) {
      setAttachments(function(prev){ return prev.concat(newAttachments); });
    }
    if (fileInputRef.current) fileInputRef.current.value = '';
  }

  async function analyze(){
    if(!caseText.trim()&&attachments.length===0)return;
    setLoading(true);setErr(null);setResult(null);setSaved('');setRetryMsg('');
    try{
      var payload = { caseText: caseText, prompt: PROMPT };
      if (attachments.length > 0) {
        payload.attachments = attachments.map(function(a){
          return { type: a.type, media_type: a.media_type, base64: a.base64 };
        });
      }
      const res=await fetchWithRetry('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)},{
        onRetry:function(att,reason){setRetryMsg('Servidor demorou. Tentando novamente ('+att+'/3)...');}
      });
      if(!res.ok){const t=await res.text();throw new Error('API '+res.status+': '+t.slice(0,200))}
      const data=await res.json();
      if(data.error)throw new Error(data.error);
      const raw=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('')||'';
      if(!raw.trim())throw new Error('Resposta vazia.');
      const parsed=fixJSON(raw);
      if(!parsed)throw new Error('Erro ao interpretar resposta.');
      setResult(parsed);
      if(sel){const{data:aData,error}=await db.from('analises').insert({paciente_id:sel.id,caso_texto:caseText,resultado_json:parsed}).select().single();if(!error){setSaved('Salvo - '+fmt(aData.created_at));loadA(sel.id)}}
      // Limpa anexos apos sucesso
      setAttachments([]);
    }catch(e){setErr(e.message)}
    finally{setLoading(false);setRetryMsg('');}
  }

  async function generateSumario(){
    if(!sel||!sel.desfecho||sumarioLoading)return;
    setSumarioLoading(true);
    setSumarioErr('');
    try{
      var anls=patA;
      if(!anls||anls.length===0){
        setSumarioErr('Paciente sem analises - nao e possivel gerar sumario.');
        return;
      }
      // Monta contexto com todas as analises em ordem cronologica
      var sortedAnls=[...anls].sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at);});
      var ctxParts=[];
      ctxParts.push('DADOS DO PACIENTE:');
      ctxParts.push('Sexo/Idade: '+(sortedAnls[0].resultado_json?.paciente?.sexo||'N/D')+' '+(sortedAnls[0].resultado_json?.paciente?.idade||'')+'a');
      ctxParts.push('Admissao: '+fmt(sel.created_at));
      ctxParts.push('Desfecho: '+DESFECHO_CFG[sel.desfecho].label+' em '+(sel.desfecho_data?fmt(sel.desfecho_data):'data nao registrada'));
      var diasInt=null;
      if(sel.created_at&&sel.desfecho_data){
        diasInt=Math.floor((new Date(sel.desfecho_data).getTime()-new Date(sel.created_at).getTime())/86400000);
        ctxParts.push('Tempo de internacao: '+diasInt+' dias');
      }
      ctxParts.push('');
      ctxParts.push('SEQUENCIA DE ANALISES ('+sortedAnls.length+' total):');
      ctxParts.push('');
      sortedAnls.forEach(function(a,idx){
        var rj=a.resultado_json||{};
        ctxParts.push('--- Analise '+(idx+1)+' ('+fmt(a.created_at)+') ---');
        if(rj.resumo)ctxParts.push('Resumo: '+rj.resumo);
        if(rj.hipoteses&&rj.hipoteses[0])ctxParts.push('Hipotese principal: '+rj.hipoteses[0].nome+' ('+rj.hipoteses[0].prob+')');
        var sv=rj.paciente&&rj.paciente.sinais_vitais;
        if(sv&&Object.keys(sv).length>0){
          ctxParts.push('Sinais vitais: '+Object.entries(sv).map(function(kv){return kv[0]+'='+kv[1];}).join(', '));
        }
        if(rj.red_flags&&rj.red_flags.length>0)ctxParts.push('Red flags: '+rj.red_flags.join('; '));
        if(rj.paciente&&rj.paciente.intervencoes&&rj.paciente.intervencoes.length>0){
          ctxParts.push('Intervencoes: '+rj.paciente.intervencoes.join('; '));
        }
        ctxParts.push('');
      });
      var contextoCompleto=ctxParts.join('\n');
      var res=await fetchWithRetry('/api/analyze',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({mode:'summary',context:contextoCompleto,system:SUMARIO_SYSTEM})
      },{
        onRetry:function(att){setSumarioErr('Servidor demorou. Tentando novamente ('+att+'/3)...');}
      });
      if(!res.ok){var t=await res.text();throw new Error('API '+res.status+': '+t.slice(0,200));}
      var data=await res.json();
      if(data.error)throw new Error(data.error);
      var raw=(data.content||[]).map(function(b){return b.type==='text'?b.text:'';}).join('')||'';
      if(!raw.trim())throw new Error('Resposta vazia.');
      // Salva no Supabase
      var now=new Date().toISOString();
      var{data:upd,error}=await db.from('pacientes').update({desfecho_resumo:raw,desfecho_resumo_data:now}).eq('id',sel.id).select().single();
      if(error)throw new Error('Erro ao salvar: '+error.message);
      setSel(upd);
      setPatients(function(prev){return prev.map(function(p){return p.id===sel.id?upd:p;});});
      setSumarioErr(''); // limpa mensagem de retry se houve
    }catch(e){
      setSumarioErr(e.message);
    }finally{

    }
  }

            </div>
          );})}
          <button className="sbtn" style={{width:'100%',marginTop:'4px',padding:'10px'}} onClick={()=>setShowStatusEdit(false)}>Cancelar</button>
        </div>
      </div>}

      {/* MODAL REGISTRAR DESFECHO */}
      {showWelcome&&<WelcomeModal onClose={function(){setShowWelcome(false);}}/>}
      {showSaps3&&sel&&<SAPS3Form paciente={sel} ultimaAnalise={patA[0]} todasAnalises={patA} onClose={function(){setShowSaps3(false);}} onSave={saveSaps3}/>}

      {showDesfecho&&sel&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}} onClick={()=>setShowDesfecho(false)}>
        <div style={{background:'#FFFFFF',border:'1px solid #E7E7E4',borderRadius:'12px',padding:'20px',maxWidth:'320px',width:'100%'}} onClick={e=>e.stopPropagation()}>
          <div style={{fontSize:'11px',color:'#9A9A97',marginBottom:'14px',letterSpacing:'0.1em'}}>REGISTRAR DESFECHO</div>
          {[{k:'alta',l:'Alta Medica',c:'#22c55e'},{k:'transferencia',l:'Transferencia',c:'#f59e0b'},{k:'obito',l:'Obito',c:'#6B6F76'}].map(function(item){return(
            <div key={item.k} onClick={async function(){
              var now=new Date().toISOString();
              await db.from('pacientes').update({desfecho:item.k,desfecho_data:now}).eq('id',sel.id);
              setSel(function(p){return Object.assign({},p,{desfecho:item.k,desfecho_data:now});});
              setPatients(function(prev){return prev.map(function(p){return p.id===sel.id?Object.assign({},p,{desfecho:item.k,desfecho_data:now}):p;});});
              setShowDesfecho(false);
            }} style={{display:'flex',alignItems:'center',gap:'12px',padding:'14px',borderRadius:'8px',cursor:'pointer',border:'1px solid '+item.c+'30',marginBottom:'8px',background:item.c+'10'}}>
              <div style={{width:'10px',height:'10px',borderRadius:'50%',background:item.c,flexShrink:0}}/>
              <span style={{color:item.c,fontWeight:700,fontSize:'14px'}}>{item.l}</span>
            </div>
          );})}
          <button className="sbtn" style={{width:'100%',marginTop:'4px',padding:'10px'}} onClick={()=>setShowDesfecho(false)}>Cancelar</button>
        </div>
      </div>}

      {!consultOpen&&<button onClick={function(){setConsultOpen(true);}} title="Consultor clinico" style={{position:'fixed',bottom:'20px',right:'20px',width:'52px',height:'52px',borderRadius:'50%',background:'linear-gradient(135deg,#1D9E75,#0d9488)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(29,158,117,0.4)',zIndex:200}}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>}
      {consultOpen&&<div style={{position:'fixed',inset:0,background:'rgba(2,6,23,0.7)',zIndex:300,display:'flex',alignItems:'flex-end',justifyContent:'center',padding:'20px'}} onClick={function(e){if(e.target===e.currentTarget)setConsultOpen(false);}}>
        <div style={{width:'100%',maxWidth:'540px',maxHeight:'85vh',background:'#FFFFFF',border:'1px solid rgba(29,158,117,0.25)',borderRadius:'12px',overflow:'hidden',display:'flex',flexDirection:'column'}}>
          {/* header */}
          <div style={{background:'#FFFFFF',padding:'12px 16px',borderBottom:'1px solid #E7E7E4',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
            <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
              <div style={{width:'28px',height:'28px',borderRadius:'7px',background:'rgba(29,158,117,0.15)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D9E75" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              </div>
              <div>
                <div style={{fontSize:'12px',fontWeight:700,color:'#1D9E75',letterSpacing:'0.1em'}}>CONSULTOR CLINICO</div>
                <div style={{fontSize:'9px',color:'#9A9A97',marginTop:'1px'}}>Apoio a decisao - nao prescreve</div>
              </div>
            </div>
            <div style={{display:'flex',gap:'6px'}}>
              {consultMsgs.length>0&&<button onClick={clearConsult} style={{background:'transparent',border:'1px solid #E7E7E4',color:'#9A9A97',fontSize:'9px',padding:'3px 8px',borderRadius:'4px',cursor:'pointer',fontFamily:'monospace'}}>Limpar</button>}
              <button onClick={function(){setConsultOpen(false);}} style={{background:'transparent',border:'none',color:'#9A9A97',fontSize:'20px',cursor:'pointer',padding:'0 4px',lineHeight:1}}>×</button>
            </div>
          </div>
          {/* chips */}
          <div style={{padding:'10px 16px',borderBottom:'1px solid #E7E7E4',flexShrink:0}}>
            <div style={{fontSize:'9px',color:'#9A9A97',letterSpacing:'0.1em',marginBottom:'7px'}}>ATALHOS</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'5px'}}>
              {CONSULT_CHIPS.map(function(c){return(<button key={c.label} onClick={function(){applyChip(c.template);}} style={{background:'rgba(29,158,117,0.1)',border:'1px solid rgba(29,158,117,0.3)',color:'#34d399',padding:'4px 9px',borderRadius:'5px',fontSize:'10px',fontFamily:'monospace',cursor:'pointer'}}>{c.icon} {c.label}</button>);})}
            </div>
          </div>
          {/* checkbox de contexto */}
          {sel&&<div onClick={function(){setConsultIncludePat(!consultIncludePat);}} style={{padding:'9px 16px',borderBottom:'1px solid #E7E7E4',display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',flexShrink:0}}>
            <div style={{width:'13px',height:'13px',borderRadius:'3px',border:'1.5px solid '+(consultIncludePat?'#1D9E75':'#D8D8D4'),background:consultIncludePat?'#1D9E75':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{consultIncludePat&&<span style={{color:'#fff',fontSize:'9px',fontWeight:700}}>v</span>}</div>
            <span style={{fontSize:'10px',color:'#6B6F76'}}>Incluir contexto do paciente <span style={{color:'#111111',fontWeight:600}}>{sel.nome}</span></span>
          </div>}
          {/* area de mensagens */}
          <div style={{flex:1,overflowY:'auto',padding:'14px 16px',minHeight:'200px'}}>
            {consultMsgs.length===0&&!consultLoading&&<div style={{textAlign:'center',color:'#D8D8D4',fontSize:'11px',lineHeight:1.8,padding:'30px 0'}}>
              Faca uma pergunta clinica.<br/>Doses, condutas, interpretacao de exames.
            </div>}
            {consultMsgs.map(function(m,i){
              var time=new Date(m.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
              if(m.role==='user'){
                return(<div key={i} style={{display:'flex',justifyContent:'flex-end',marginBottom:'12px'}}>
                  <div style={{maxWidth:'78%',background:'rgba(29,158,117,0.12)',border:'1px solid rgba(29,158,117,0.3)',borderRadius:'10px 10px 2px 10px',padding:'8px 12px'}}>
                    <div style={{fontSize:'12px',color:'#111111',lineHeight:1.5,whiteSpace:'pre-wrap'}}>{m.content}</div>
                    <div style={{fontSize:'8px',color:'#9A9A97',marginTop:'4px',textAlign:'right'}}>{time}</div>
                  </div>
                </div>);
              }
              return(<div key={i} style={{display:'flex',gap:'8px',marginBottom:'12px'}}>
                <div style={{width:'24px',height:'24px',borderRadius:'6px',background:'rgba(29,158,117,0.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:'2px'}}>
                  <svg width="12" height="12" viewBox="0 0 90 90"><path d="M 6,45 L 12,45 L 15,25 L 25,56 L 35,25 L 45,45 L 50,45 L 54,38 L 57,18 L 62,72 L 66,38 L 70,45 L 82,45" fill="none" stroke={m.isError?'#ef4444':'#1D9E75'} strokeWidth="5" strokeLinecap="round"/></svg>
                </div>
                <div style={{maxWidth:'88%',background:m.isError?'#FBE3E3':'#FFFFFF',border:'1px solid '+(m.isError?'#ef444440':'#E7E7E4'),borderRadius:'2px 10px 10px 10px',padding:'10px 12px'}}>
                  <div style={{fontSize:'12px',color:m.isError?'#fca5a5':'#333333'}}>{renderMD(m.content)}</div>
                  <div style={{fontSize:'8px',color:'#9A9A97',marginTop:'6px'}}>{time}</div>
                </div>
              </div>);
            })}
            {consultLoading&&<div style={{display:'flex',gap:'8px',marginBottom:'12px',alignItems:'center'}}>
              <div style={{width:'24px',height:'24px',borderRadius:'6px',background:'rgba(29,158,117,0.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <div style={{width:'12px',height:'12px',border:'2px solid #E7E7E4',borderTop:'2px solid #1D9E75',borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
              </div>
              <span style={{fontSize:'11px',color:'#9A9A97'}}>Pensando...</span>
            </div>}
            <div ref={consultEndRef}/>
          </div>
          {/* input */}
          <div style={{padding:'10px 12px',borderTop:'1px solid #E7E7E4',background:'#F5F5F3',flexShrink:0}}>
            <div style={{display:'flex',gap:'8px',alignItems:'flex-end'}}>
              <textarea ref={consultInputRef} value={consultInput} onChange={function(e){setConsultInput(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendConsult();}}} placeholder="Sua pergunta..." style={{flex:1,background:'#FFFFFF',border:'1px solid #E7E7E4',borderRadius:'6px',padding:'8px 10px',color:'#333333',fontFamily:'monospace',fontSize:'12px',resize:'none',minHeight:'36px',maxHeight:'120px'}} rows="1"/>
              <button onClick={sendConsult} disabled={!consultInput.trim()||consultLoading} style={{background:!consultInput.trim()||consultLoading?'#E7E7E4':'linear-gradient(135deg,#1D9E75,#0d9488)',border:'none',borderRadius:'6px',color:'#fff',padding:'8px 16px',fontWeight:700,fontSize:'11px',cursor:!consultInput.trim()||consultLoading?'not-allowed':'pointer',fontFamily:'monospace',opacity:!consultInput.trim()||consultLoading?0.5:1}}>{consultLoading?'...':'Enviar'}</button>
            </div>
            <div style={{textAlign:'center',fontSize:'8px',color:'#D8D8D4',marginTop:'8px',letterSpacing:'0.05em'}}>NAO SUBSTITUI JULGAMENTO CLINICO - NAO E PRESCRICAO</div>
          </div>
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
